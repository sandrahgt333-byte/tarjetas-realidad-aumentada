<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjetas geométricas en realidad aumentada</title>
  <!-- Bibliotecas: A-Frame 1.6.0 y AR.js 3.4.7 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/three.js/build/AR.js"></script>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; font-family:Arial,sans-serif; }
    #panel {
      position:fixed; z-index:10; top:12px; left:50%; transform:translateX(-50%);
      width:max-content; max-width:92vw; box-sizing:border-box; text-align:center;
      padding:10px 14px; border-radius:12px; color:#fff; background:rgba(0,0,0,.72);
    }
    #panel strong { display:block; margin-bottom:4px; }
    #sizeButton { padding:9px 14px; border:0; border-radius:8px; font-size:16px; cursor:pointer; }
    #status { font-size:14px; margin-top:6px; }
  </style>
</head>
<body>
  <div id="panel">
    <strong>Tarjetas geométricas en realidad aumentada</strong>
    <div>Estudiante: <span id="studentName">SANDRA</span></div>
    <button id="sizeButton">Cambiar tamaño</button>
    <div id="status">Tamaño: Normal</div>
  </div>

  <a-scene embedded
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;">

    <!-- Tarjeta A: marcador Hiro -> cubo azul -->
    <a-marker preset="hiro">
      <a-box id="blueCube" position="0 0.5 0" rotation="0 0 0"
        scale="1 1 1" color="#0066ff"
        material="metalness:0.05; roughness:0.45;">
      </a-box>
    </a-marker>

    <!-- Tarjeta B: marcador Kanji -> esfera roja -->
    <a-marker preset="kanji">
      <a-sphere id="redSphere" position="0 0.5 0"
        radius="0.5" scale="1 1 1" color="#ff2020"
        material="metalness:0.03; roughness:0.4;">
      </a-sphere>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Cambia el nombre entre las comillas para personalizar la aplicación.
    document.getElementById('studentName').textContent = 'SANDRA';

    const cube = document.getElementById('blueCube');
    const sphere = document.getElementById('redSphere');
    const button = document.getElementById('sizeButton');
    const status = document.getElementById('status');
    let enlarged = false;

    button.addEventListener('click', () => {
      enlarged = !enlarged;
      const scale = enlarged ? '1.5 1.5 1.5' : '1 1 1';
      cube.setAttribute('scale', scale);
      sphere.setAttribute('scale', scale);
      status.textContent = 'Tamaño: ' + (enlarged ? 'Ampliado' : 'Normal');
    });
  </script>
</body>
</html>
